name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Unzip Android project
        run: unzip -o CardGolfScoreTrackerAndroidProject.zip

      - name: Build debug APK
        run: |
          cd CardGolfScoreTrackerAndroid
          ../gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardGolfScoreTracker-debug-apk
          path: CardGolfScoreTrackerAndroid/app/build/outputs/apk/debug/*.apk
